[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
# No -s: dist/serve.json rewrites only client routes to index.html so the
# prerendered marketing/auth pages serve as real static HTML.
cmd = "npx serve dist --listen tcp://0.0.0.0:$PORT"
